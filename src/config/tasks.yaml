# Task configuration for CrewAI Jira → Developer → Reviewer flow

analyze_jira_task:
  description: >
    Find and analyze the highest-priority Jira task with the "AI" label in
    project: {jira_project}

    Steps:
    1. Search Jira for tasks using JQL:
       project = "{jira_project}" AND labels = "AI" AND status != "Done"
       ORDER BY priority DESC, created ASC
    2. Pick the FIRST task returned (highest priority, oldest).
       If no tasks are found, return outcome "no_dev_needed" with a message
       saying there are no AI-labeled tasks to process.
    3. Fetch full task details (summary, description, comments, acceptance criteria).
    4. Check DataDog for any related errors, metrics, or alerts mentioned in the task.
    5. Examine the relevant project(s) codebase to understand current implementation.
    6. Determine the scope of work required.

    Based on your analysis, produce ONE of the following outcomes:
    - "action_needed": A detailed task definition specifying exactly what code changes
      are needed and in which project(s). Include file paths, function names, and
      expected behavior.
    - "insufficient_info": If the Jira task lacks critical information needed to proceed.
      Explain what information is missing.
    - "no_dev_needed": If the task does not require any code changes (e.g., it's a
      question, documentation-only, or already resolved, or no tasks found).

    Available projects:
    {project_paths}
  expected_output: >
    A JSON object with the following structure:
    {
      "outcome": "action_needed" | "insufficient_info" | "no_dev_needed",
      "jira_task_key": "<the selected Jira task key, e.g. PROJ-123>",
      "project_path": "<path to the project requiring changes>",
      "summary": "<brief summary of what needs to be done>",
      "details": "<detailed implementation instructions or explanation>",
      "affected_files": ["<list of files likely to be modified>"]
    }
  agent: task_analyzer

implement_changes:
  description: >
    Implement the following task in project: {project_path}

    Task summary: {task_summary}

    Detailed instructions:
    {task_details}

    Affected files: {affected_files}

    Steps:
    0. DETECT PROJECT LANGUAGE & TOOLS:
       - Inspect the project root for manifest files to identify the language and ecosystem:
         * package.json / package-lock.json / yarn.lock → Node.js/TypeScript (use npm/yarn/pnpm)
         * pyproject.toml / requirements.txt / setup.py / Pipfile → Python (use pip/poetry/uv)
         * pom.xml / build.gradle / build.gradle.kts → Java/Kotlin (use maven/gradle)
         * go.mod → Go (use go build/test)
         * Cargo.toml → Rust (use cargo)
         * Gemfile → Ruby (use bundler)
         * composer.json → PHP (use composer)
         * Makefile / CMakeLists.txt → C/C++ (use make/cmake)
       - Install dependencies using the detected package manager (e.g. npm install,
         pip install -r requirements.txt, mvn dependency:resolve, go mod download, etc.)
       - Identify linting/formatting tools (eslint, prettier, black, flake8, golangci-lint,
         clippy, etc.) and ensure they are available.
    1. Read and understand the current code in the affected files.
    2. Create a new branch from the default branch (name it: feature/{jira_task_key}).
    3. Implement the required changes following existing code conventions.
    4. Run the project's linter/formatter to ensure code style compliance.
    5. Run existing tests to verify nothing is broken. Fix if needed.
    6. Commit the changes with a descriptive message referencing the Jira task.
    7. Push the branch and create a merge request in GitLab.
    8. The MR title should reference the Jira task key.
    9. The MR description should explain what was changed and why.

    GitLab project path: {gitlab_project_path}
  expected_output: >
    A JSON object with the following structure:
    {
      "merge_request_url": "<URL of the created merge request>",
      "merge_request_iid": "<MR IID number>",
      "branch_name": "<name of the created branch>",
      "changes_summary": "<summary of implemented changes>",
      "detected_stack": "<detected language/framework/tools>",
      "tests_passed": true | false,
      "lint_passed": true | false,
      "gitlab_project_path": "<gitlab project path>"
    }
  agent: developer

implement_review_fixes:
  description: >
    Fix the review comments on merge request: {merge_request_url}

    Review feedback:
    {review_feedback}

    Steps:
    1. Read the review comments and understand what changes are required.
    2. Checkout the existing branch: {branch_name}
    3. Detect the project's language and tools (inspect manifest files as in initial
       implementation) and ensure dependencies are installed.
    4. Implement the requested fixes.
    5. Run linter/formatter and tests to verify the fixes are correct.
    6. Commit and push the changes.
    7. Reply to review comments indicating the fixes have been made.

    GitLab project path: {gitlab_project_path}
  expected_output: >
    A JSON object with the following structure:
    {
      "merge_request_url": "<URL of the merge request>",
      "merge_request_iid": "<MR IID number>",
      "fixes_summary": "<summary of fixes applied>",
      "tests_passed": true | false,
      "lint_passed": true | false,
      "gitlab_project_path": "<gitlab project path>"
    }
  agent: developer

review_merge_request:
  description: >
    Review the merge request: {merge_request_url}
    GitLab project: {gitlab_project_path}
    MR IID: {merge_request_iid}

    Steps:
    1. Fetch the merge request diff from GitLab.
    2. Review the code changes for:
       - Correctness (does it solve the stated problem?)
       - Code quality (clean, readable, follows conventions)
       - Security (no vulnerabilities introduced)
       - Performance (no obvious performance issues)
       - Test coverage (are changes adequately tested?)
    3. Based on your review, produce ONE of the following outcomes:
       - "approved": The MR is good to merge. Add an "Approved" comment.
       - "changes_requested": Specific changes are needed. Provide clear feedback.
  expected_output: >
    A JSON object with the following structure:
    {
      "outcome": "approved" | "changes_requested",
      "merge_request_url": "<URL of the merge request>",
      "merge_request_iid": "<MR IID number>",
      "feedback": "<approval message or detailed list of required changes>",
      "gitlab_project_path": "<gitlab project path>"
    }
  agent: mr_reviewer
