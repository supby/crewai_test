# Flow configuration
# Configurable project paths and GitLab settings

# Projects the agents can work on (cloned from GitLab into /workspace)
projects:
  - gitlab_ref: "https://source.tui/cr/tuicom/support-services/book-processing-service"
    description: "The 'BPS' service. 'Book Processing Service'"
  - gitlab_ref: "https://source.tui/cr/tuicom/support-services/midoco-service"
    description: "The 'Midos' service. 'Midoco-Service'"

# Maximum review iterations before escalating to human
max_review_iterations: 3

# Jira configuration
jira:
  # Jira project key (overridable via JIRA_PROJECT env var)
  project: "OKAPI"

# Workspace directory where projects are cloned
workspace_dir: "/workspace"
