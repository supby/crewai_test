[project]
name = "crewai-jira-dev-flow"
version = "0.1.0"
description = "CrewAI flow: Jira Task Analyzer → Developer → MR Reviewer"
requires-python = ">=3.11"
dependencies = [
    "crewai[google-genai]>=0.86.0",
    "crewai-tools>=0.17.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
jira-dev-flow = "src.main:run"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
